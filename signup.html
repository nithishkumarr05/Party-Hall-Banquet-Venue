<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth">

<head>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        venue: {
                            primary: '#4A1D3D',
                            secondary: '#6B2E5A',
                            muted: '#9B7A8F',
                            border: '#F0E4EC',
                            accent: '#D4AF7A',
                            'accent-dark': '#B8945A',
                            'accent-light': '#F5E6D0',
                            blush: '#B8346B',
                            'blush-light': '#FCE8F0',
                            bg: '#FFFFFF',
                            'bg-soft': '#FDF8FA',
                        }
                    },
                    fontFamily: {
                        display: ['"Playfair Display"', 'Georgia', 'serif'],

    <style>
        body {
            background-color: #FFFFFF;
            color: #2D1A28;
            transition: background-color 0.4s, color 0.4s;
            font-family: 'Inter', system-ui, sans-serif;
        }
        .dark body {
            background-color: #120A10;
            color: #F5EAF0;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Playfair Display', Georgia, serif;
            font-weight: 600 !important;
        }
        p { font-weight: 400; }
        p strong, p b { font-weight: 550 !important; }

        body::-webkit-scrollbar { width: 8px; }
        body::-webkit-scrollbar-track { background: #FDF8FA; border-radius: 10px; }
        body::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #D4AF7A, #6B2E5A); border-radius: 10px; }
        .dark body::-webkit-scrollbar-track { background: #2A1520; }

        .hide-scrollbar::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        .hide-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .hide-scrollbar::-webkit-scrollbar-thumb {
            background: #6B2E5A;
            border-radius: 10px;
        }
        .hide-scrollbar {
            scrollbar-width: thin;
            scrollbar-color: #6B2E5A transparent;
        }

        @keyframes slowZoom {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }
        .slow-zoom {
            animation: slowZoom 28s ease-in-out infinite alternate;
        }

        @keyframes floatPop {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(3deg); }
        }
        .float-pop {
            animation: floatPop 6s ease-in-out infinite;
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1); opacity: 0.4; }
            50% { transform: scale(1.15); opacity: 0.15; }
        }
        .breathe-ring {
            animation: breathe 5s ease-in-out infinite;
        }

        @keyframes toastFade {
            0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
            15% { opacity: 1; transform: translateX(-50%) translateY(0); }
            85% { opacity: 1; transform: translateX(-50%) translateY(0); }
            100% { opacity: 0; transform: translateX(-50%) translateY(-10px); }
        }
        .toast-animation {
            animation: toastFade 2.5s ease forwards;
        }

        [dir="rtl"] .rtl\:right-auto { right: auto; }
        [dir="rtl"] .rtl\:left-0 { left: 0; }
        [dir="rtl"] .rtl\:rotate-180 { transform: rotate(180deg); }
        [dir="rtl"] .me-2 { margin-left: 0.5rem; margin-right: 0; }
        [dir="rtl"] .ms-2 { margin-right: 0.5rem; margin-left: 0; }

        input:-webkit-autofill {
            -webkit-box-shadow: 0 0 0 30px #FDF8FA inset !important;
        }
        .dark input:-webkit-autofill {
            -webkit-box-shadow: 0 0 0 30px #120A10 inset !important;
            -webkit-text-fill-color: #F5EAF0 !important;
        }

        .glass-card {
            background: #FFFFFF;
            border: 1px solid #F0E4EC;
            box-shadow: 0 8px 20px rgba(74, 29, 61, 0.06);
            transition: all 0.4s ease;
        }
        .dark .glass-card {
            background: #201018;
            border-color: #4A2540;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
        }

        /* ═══ index.html theme tokens ═══ */
        .btn-gold {
            background: linear-gradient(135deg, #D4AF7A 0%, #E8CDA0 100%);
            color: #2D1A28;
            font-weight: 700;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .btn-gold::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
            transition: left 0.6s ease;
        }
        .btn-gold:hover::before { left: 100%; }
        .btn-gold:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px -8px rgba(212,175,122,0.65);
        }

        .icon-btn {
            width: 40px; height: 40px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #FDF8FA;
            color: #4A1D3D;
            border: 1px solid #F0E4EC;
            transition: all 0.25s ease;
            cursor: pointer;

            background: #201018;
            color: #F5EAF0;
            border-color: #4A2540;
        }

            background: linear-gradient(135deg, #D4AF7A, #B8346B);
            color: #FFFFFF;
            border-color: transparent;
            transform: rotate(12deg) scale(1.05);

        .animated-border {

            background: linear-gradient(60deg, #6B2E5A, #D4AF7A, #6B2E5A);
            background-size: 200% 200%;
            animation: gradientShift 3s ease infinite;
        }

            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }

        }

    <!-- Toast Container -->
    <div id="toastContainer" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 pointer-events-none w-auto max-w-[90vw]"></div>

    <script>
        (function() {
            // Toast helper
            function showToast(message, type = 'success') {
                const container = document.getElementById('toastContainer');
                if (!container) return;
                const toast = document.createElement('div');
                let bgColor = 'bg-[#6B2E5A]';
                let icon = '<i class="fas fa-check-circle text-white text-sm"></i>';
                if (type === 'error') { bgColor = 'bg-red-500'; icon = '<i class="fas fa-times-circle text-white text-sm"></i>'; }
                else if (type === 'warning') { bgColor = 'bg-amber-500'; icon = '<i class="fas fa-exclamation-triangle text-white text-sm"></i>'; }
                else if (type === 'info') { bgColor = '#4A1D3D'; icon = '<i class="fas fa-info-circle text-white text-sm"></i>'; }
                toast.className = `toast-animation mb-2 px-5 py-3 rounded-xl shadow-lg text-xs sm:text-sm font-medium flex items-center gap-2 pointer-events-auto text-white max-w-full`;
                toast.style.backgroundColor = bgColor;
                toast.innerHTML = `${icon} <span class="break-words">${message}</span>`;
                container.appendChild(toast);
                setTimeout(() => { if (toast && toast.remove) toast.remove(); }, 2600);
            }

            // Password visibility toggles
            function initPasswordToggles() {
                document.querySelectorAll('.toggle-password').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.preventDefault();
                        const wrapper = btn.closest('.relative');
                        if (!wrapper) return;
                        const input = wrapper.querySelector('input');
                        const icon = btn.querySelector('i');
                        if (input.type === 'password') {
                            input.type = 'text';
                            if (icon) { icon.className = 'fas fa-eye'; }
                        } else {
                            input.type = 'password';
                            if (icon) { icon.className = 'fas fa-eye-slash'; }
                        }
                    });
                });
            }

            // Theme toggle
            const themeToggle = document.getElementById('theme-toggle-signup');
            const htmlTag = document.documentElement;

            function updateThemeIcons() {
                const isDark = htmlTag.classList.contains('dark');
                const sunIcon = document.querySelector('#theme-toggle-signup .fa-sun');
                const moonIcon = document.querySelector('#theme-toggle-signup .fa-moon');
                if (sunIcon && moonIcon) {
                    if (isDark) {
                        sunIcon.classList.add('hidden');
                        moonIcon.classList.remove('hidden');
                    } else {
                        sunIcon.classList.remove('hidden');
                        moonIcon.classList.add('hidden');
                    }
                }
            }

            function toggleTheme() {
                if (htmlTag.classList.contains('dark')) {
                    htmlTag.classList.remove('dark');
                    localStorage.setItem('theme', 'light');
                } else {
                    htmlTag.classList.add('dark');
                    localStorage.setItem('theme', 'dark');
                }
                updateThemeIcons();
            }
            if (themeToggle) themeToggle.addEventListener('click', toggleTheme);

            // Initialize theme
            if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('prefers-color-scheme: dark').matches)) {
                htmlTag.classList.add('dark');
            } else {
                htmlTag.classList.remove('dark');
            }
            updateThemeIcons();

            // RTL Toggle
            const rtlToggle = document.getElementById('rtl-toggle-signup');

            function applyRTLStyles(isRtl) {
                if (isRtl) {
                    htmlTag.setAttribute('dir', 'rtl');
                    localStorage.setItem('direction', 'rtl');
                } else {
                    htmlTag.removeAttribute('dir');
                    localStorage.setItem('direction', 'ltr');
                }
            }

            function toggleRTL() {
                const currentDir = htmlTag.getAttribute('dir');
                if (currentDir === 'rtl') {
                    applyRTLStyles(false);
                    showToast('LTR layout activated', 'info');
                } else {
                    applyRTLStyles(true);
                    showToast('RTL layout activated', 'info');
                }
            }
            if (rtlToggle) rtlToggle.addEventListener('click', toggleRTL);
            if (localStorage.getItem('direction') === 'rtl') {
                htmlTag.setAttribute('dir', 'rtl');
            } else if (localStorage.getItem('direction') === 'ltr') {
                htmlTag.removeAttribute('dir');
            }

            // Social sign-up demo handlers
            const socialHandlers = { google: 'Google', facebook: 'Facebook', apple: 'Apple' };
            Object.keys(socialHandlers).forEach(provider => {
                const btn = document.getElementById(`${provider}Signup`);
                if (btn) {
                    btn.addEventListener('click', () => {
                        showToast(`${socialHandlers[provider]} sign-up coming soon! Use email to get 10% off your first booking.`, 'info');
                    });
                }
            });

            // Form validation and account creation
            const signupForm = document.getElementById('signupForm');
            if (signupForm) {
                signupForm.addEventListener('submit', (e) => {
                    e.preventDefault();

                    const fullname = document.getElementById('fullname').value.trim();
                    const email = document.getElementById('email').value.trim();
                    const password = document.getElementById('password').value;
                    const confirm = document.getElementById('confirmPassword').value;
                    const termsChecked = document.getElementById('termsCheckbox').checked;

                    if (!fullname || fullname.length < 2) {
                        return showToast('Please enter your full name', 'warning');
                    }
                    const emailPattern = /^[^\s@]+@([^\s@]+\.)+[^\s@]+$/;
                    if (!emailPattern.test(email)) {
                        return showToast('Please enter a valid email address', 'error');
                    }
                    if (!password || password.length < 6) {
                        return showToast('Password must be at least 6 characters', 'warning');
                    }
                    if (password !== confirm) {
                        return showToast('Passwords do not match', 'error');
                    }
                    if (!termsChecked) {
                        return showToast('Please agree to the Terms of Service', 'warning');
                    }

                    const firstName = fullname.split(' ')[0] || "Event Planner";
                    showToast(`✨ Welcome ${firstName}! Your 10% discount is applied. Check your inbox.`, 'success');
                    // Uncomment to redirect: setTimeout(() => { window.location.href = "customer.html"; }, 1500);
                });
            }

            // Fix for keyboard open on mobile
            const mainCard = document.querySelector('main');
            if (mainCard) {
                const inputs = mainCard.querySelectorAll('input');
                inputs.forEach(inp => {
                    inp.addEventListener('focus', () => {
                        setTimeout(() => {
                            if (mainCard) {
                                mainCard.scrollTo({ top: mainCard.scrollHeight, behavior: 'smooth' });
                            }
                        }, 200);
                    });
                });
            }

            initPasswordToggles();
        })();
    </script>
</body>

</html>
